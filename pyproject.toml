[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypothesis-lab"
version = "0.1.0"
description = "Silnik testowania hipotez giełdowych na danych historycznych"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=16"]

[project.optional-dependencies]
dev = ["pytest>=8", "streamlit>=1.40"]

[tool.setuptools]
packages = ["hypothesis_lab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
